name: Build
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Java Build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: 25
          cache: 'maven'
      - name: Install CloudSim Plus before cloudsimplus#595
        # The benchmarks use the CloudSim Plus API before cloudsimplus#595 (a List<Pe> per Host),
        # which isn't published. So it's built from the commit right before that PR.
        # Remove this step (and -nsu below) when the benchmarks use the API after #595.
        run: |
          git clone --quiet --filter=blob:none https://github.com/cloudsimplus/cloudsimplus.git "$RUNNER_TEMP/cloudsimplus"
          git -C "$RUNNER_TEMP/cloudsimplus" checkout --quiet 9bb9de25c
          mvn -B -q -f "$RUNNER_TEMP/cloudsimplus/pom.xml" install -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip
      - name: Maven Build
        # -nsu (no snapshot updates) avoids replacing the CloudSim Plus installed above by the published 9.0.0-SNAPSHOT.
        run: mvn -B -nsu package
